<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aggiungimi su unimate</title>
<meta property="og:title" content="Aggiungimi su unimate">
<meta property="og:description" content="Scopri quando siamo liberi tra una lezione e l'altra. Gratis su iPhone e Android.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="unimate">
<meta property="og:image" content="https://unimate-pa.github.io/scarica/icona.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#0A1A4D;color:#fff;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  img.icon{width:88px;height:88px;border-radius:22px}
  h1{margin:6px 0 0;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
  h1 span{color:#FFC21A}
  p{margin:0;color:#C9D6FF;font-size:16px;line-height:1.45}
  .btn{display:block;width:100%;text-decoration:none;font-weight:800;font-size:17px;padding:15px;border-radius:16px;text-align:center}
  .primary{background:#FFC21A;color:#2B1D00;margin-top:8px}
  .store{background:rgba(255,255,255,.1);color:#fff}
  .small{font-size:13px;color:#8FA3DB}
</style>
</head>
<body>
<main>
  <img class="icon" src="https://unimate-pa.github.io/scarica/icona.png" alt="unimate">
  <h1><span id="who">Un amico</span> ti ha invitato su unimate</h1>
  <p>Aggiungilo agli amici e vedrete quando siete liberi insieme tra una lezione e l'altra.</p>
  <a class="btn primary" id="open" href="#">Apri in unimate</a>
  <p class="small">Non hai ancora l'app? Scaricala gratis:</p>
  <a class="btn store" href="https://apps.apple.com/it/app/id6826922572">App Store (iPhone)</a>
  <a class="btn store" href="https://play.google.com/store/apps/details?id=com.unimatepa.app">Google Play (Android)</a>
  <p class="small" id="hint"></p>
</main>
<script>
  // username di chi invita (solo lettere, numeri e _)
  var m = location.search.match(/[?&]u=([A-Za-z0-9_]{3,20})/);
  var u = m ? m[1].toLowerCase() : '';
  var ua = navigator.userAgent || '';
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua);
  var PLAY = 'https://play.google.com/store/apps/details?id=com.unimatepa.app';
  var APPSTORE = 'https://apps.apple.com/it/app/id6826922572';
 
  if (u) {
    document.getElementById('who').textContent = '@' + u;
    document.getElementById('hint').textContent = 'Dopo averla scaricata, cerca @' + u + ' nella sezione + per aggiungerlo.';
  }
 
  // Android: apre l'app se c'è, altrimenti Google Play. iPhone: prova ad aprire l'app (se non c'è, restano i tasti per scaricarla).
  var appLink = android
    ? 'intent://add/' + u + '#Intent;scheme=unimate;package=com.unimatepa.app;S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end'
    : 'unimate://add/' + u;
  var open = document.getElementById('open');
  open.href = u ? appLink : (android ? PLAY : APPSTORE);
 
  function tryOpen() {
    if (u) location.href = appLink;
  }
  // si prova subito ad aprire l'app; il tasto resta per riprovare
  if (u && (android || ios)) setTimeout(tryOpen, 300);
</script>
</body>
</html>
